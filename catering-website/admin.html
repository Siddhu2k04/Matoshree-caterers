<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="css/style.css">
<title>Admin Panel - Orders</title>

<style>
 body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f5f5f5;
}

h1 {
  text-align: center;
  margin: 25px 0;
  color: #ff9800;
}

.table-container {
  width: 100%;
  padding: 0 10px;
  overflow-x: auto;
}

table {
  width: 100%;
  max-width: 1300px;
  margin: auto;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #ff3b3b;
  color: white;
}

/* DELETE BUTTON STYLE */
.delete-btn {
  background: #ff3b3b;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
}

.delete-btn:hover {
  background: #ff0000;
}

/* ---------------- MOBILE RESPONSIVE CARD VIEW ---------------- */
@media(max-width: 768px){

  thead {
    display: none; /* hide headings on mobile */
  }

  table, tbody, tr, th, td {
    display: block !important;
    width: 100%;
  }

  tr {
    background: #fff;
    margin-bottom: 15px;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border: 1px solid #ddd;
  }

  td {
    border: none;
    border-bottom: 1px solid #eee;
    text-align: left;
    position: relative;
    padding-left: 120px;
    padding-top: 8px;
    padding-bottom: 8px;
  }

  td::before {
    content: attr(data-label);
    position: absolute;
    left: 15px;
    font-weight: bold;
    color: #ff9800;
    width: 100px;
  }

  td:last-child {
    border-bottom: none;
  }
}
</style>

</head>
<body>
<header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/logo.png" alt="Catering Logo" />
        <h1>Matoshree caterers</h1>
      </div>

      <!-- Navigation links -->
      <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="cart.html">Order</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin-login.html">Admin</a></li>
    </ul>

      <!-- Mobile Menu Toggle Button -->
      <button class="menu-toggle">☰</button>
    </nav>
  </header>

  <script>
    const toggleBtn = document.querySelector(".menu-toggle");
    const navLinks = document.querySelector(".nav-links");

    toggleBtn.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });
  </script>


<h1>Admin Panel - Orders</h1>
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Name</th>
        <th>Mobile</th>
        <th>Date</th>
        <th>Menu Items</th>
        <th>Total Price</th>
        <th>People</th>
        <th>Address</th>
        <th>Payment Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="orders-table"></tbody>
  </table>
</div>

<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAFcR7dpuPLCKxKVF8U21ogtLARx2djXpM",
  authDomain: "caters-710ea.firebaseapp.com",
  projectId: "caters-710ea",
  storageBucket: "caters-710ea.appspot.com",
  messagingSenderId: "1058333296618",
  appId: "1:1058333296618:web:ba63fac8c4fca4758f5493"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const table = document.getElementById("orders-table");

// 🔹 Only allow logged-in admin
onAuthStateChanged(auth, user => {
  if(!user) {
    window.location.href = "admin-login.html"; // redirect if not logged in
  }
});

// Function to load orders
async function loadOrders() {
  table.innerHTML = "";
  const querySnapshot = await getDocs(collection(db, "orders"));

  querySnapshot.forEach(docSnap => {
    const orderId = docSnap.id;
    const order = docSnap.data();

    const row = document.createElement("tr");
    row.innerHTML = `
      <td data-label="Order ID">${orderId}</td>
      <td data-label="Name">${order.customerName}</td>
      <td data-label="Mobile">${order.customerMobile}</td>
      <td data-label="Date">${order.orderDate}</td>
      <td data-label="Menu Items">${order.dishes?.map(d => d.name).join(", ") || ""}</td>
      <td data-label="Total Price">₹${order.total}</td>
      <td data-label="People">${order.numberOfPeople}</td>
      <td data-label="Address">${order.address}</td>
      <td data-label="Payment Status">
        <span style="color:${order.paymentStatus === 'Paid' ? 'green' : 'red'};">
          ${order.paymentStatus || "Pending"}
        </span>
      </td>
      <td data-label="Action">
        <button class="delete-btn" onclick="deleteOrder('${orderId}')">Delete</button>
      </td>
    `;
    table.appendChild(row);
  });
}

// Delete order
window.deleteOrder = async function(orderId) {
  if(confirm("Are you sure you want to delete this order?")) {
    await deleteDoc(doc(db, "orders", orderId));
    loadOrders();
  }
}

loadOrders();
</script>

</body>
</html>
